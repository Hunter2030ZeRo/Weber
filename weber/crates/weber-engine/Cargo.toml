[package]
name = "weber-engine"
version = "0.1.0-alpha.1"
edition = "2021"
license = "Apache-2.0"

[lib]
crate-type = ["staticlib"]

[dependencies]
obscura-browser = { path = "../../vendor/obscura/crates/obscura-browser", features = ["render"] }
tokio = { version = "1", features = ["rt", "time", "net", "sync", "io-util", "macros"] }
serde_json = "1"
url = "2"


obscura-net = { path = "../../vendor/obscura/crates/obscura-net" }
async-trait = "0.1"
base64 = "0.22"
libc = "0.2"
