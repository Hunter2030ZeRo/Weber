[package]
name = "weber-host"
version = "0.1.0-alpha.1"
edition = "2021"
license = "Apache-2.0"

[dependencies]
obscura-browser = { path = "../../vendor/obscura/crates/obscura-browser", features = ["render"] }
tokio = { version = "1", features = ["rt", "time", "net", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
winit = "0.30"
softbuffer = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }

[[example]]
name = "native"
