<!doctype html>
<html><head><meta charset="utf-8"><title>Weber Monaco Probe</title>
<style>html,body,#editor{margin:0;width:100%;height:100%;overflow:hidden}</style>
<link rel="stylesheet" href="/editor.css">
<script>
globalThis.monacoProbe = { stage: 'document', errors: [], workers: 0, workerMessages: 0 };
addEventListener('error', event => monacoProbe.errors.push(String(event.error && event.error.stack || event.message)));
addEventListener('unhandledrejection', event => monacoProbe.errors.push(String(event.reason && event.reason.stack || event.reason)));
globalThis.MonacoEnvironment = { getWorker: () => {
  const worker = new Worker('/editor.worker.js', { type: 'module' });
  monacoProbe.workers++;
  worker.addEventListener('message', () => monacoProbe.workerMessages++);
  const reportWorkerError = event => {
    const message = 'Editor worker: ' + String(event.message || event);
    if (!monacoProbe.errors.includes(message)) monacoProbe.errors.push(message);
  };
  worker.addEventListener('error', reportWorkerError);
  // Observe both standard error entry points. The pinned Obscura Worker shim
  // currently calls onerror for script failures but misses EventTarget listeners.
  // This exposes the actual failure instead of waiting for the diff deadline.
  worker.onerror = reportWorkerError;
  return worker;
} };
</script></head><body><div id="editor"></div><script type="module" src="/editor.js"></script></body></html>
