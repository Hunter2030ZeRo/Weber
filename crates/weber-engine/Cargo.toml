[package]
name = "weber-engine"
version = "0.1.0-alpha.1"
edition = "2021"
license = "Apache-2.0"

[lib]
crate-type = ["staticlib"]

[dependencies]
obscura-browser = { path = "../../vendor/obscura/crates/obscura-browser", features = ["render"] }
tokio = { version = "1", features = ["rt", "time", "net", "sync"] }
serde_json = "1"
url = "2"
