name: Chromium-free Electron source runtime
on:
  push:
    branches: [codex/obscura-runtime]
  pull_request:
    paths: ['weber/**', 'shell/browser/obscura/**', 'shell/renderer/obscura/**', '.github/workflows/weber-runtime.yml']
permissions:
  contents: read
concurrency:
  group: weber-runtime-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      WEBER_UNSANDBOXED_DEVELOPMENT: '1'
      WEBER_BACKEND_LAUNCHER: ${{ github.workspace }}/weber/runtime-config/target/debug/weber-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - run: git submodule update --init --depth 1 weber/vendor/obscura
      - name: Apply retained raw-frame API extension
        run: |
          git -C weber/vendor/obscura apply "$PWD/weber/patches/obscura/0001-desktop-raw-frame.patch"
          git -C weber/vendor/obscura apply "$PWD/weber/patches/obscura/0002-isolated-preload.patch"
          git -C weber/vendor/obscura apply "$PWD/weber/patches/obscura/0003-frame-invalidation.patch"
          git -C weber/vendor/obscura apply "$PWD/weber/patches/obscura/0004-browser-navigation.patch"
          git -C weber/vendor/obscura apply "$PWD/weber/patches/obscura/0005-desktop-protocols.patch"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            weber -> target
            weber/runtime-config -> target
          cache-on-failure: true
      - run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libgtk-3-dev nlohmann-json3-dev cmake xvfb xauth xdotool
      - name: Test real engine APIs
        id: engine
        continue-on-error: true
        run: cargo test --release --manifest-path weber/Cargo.toml -p weber-engine -- --nocapture
      - name: Build Obscura static boundary
        run: cargo build --release --manifest-path weber/Cargo.toml -p weber-engine
      - name: Compile Chromium-free desktop host
        run: |
          cmake -S weber -B out/runtime -DCMAKE_BUILD_TYPE=Release -DWEBER_ENGINE_LIBRARY="$PWD/weber/target/release/libweber_engine.a"
          cmake --build out/runtime --parallel 2
      - name: Test renderer process boundary
        id: boundary
        continue-on-error: true
        run: ctest --test-dir out/runtime --output-on-failure
      - name: Test real GTK windows and X11 input
        id: desktop
        continue-on-error: true
        run: xvfb-run -a python3 weber/tests/desktop_test.py out/runtime/weber-desktop-host out/runtime/obscura/weber-obscura-renderer
      - name: Verify browser host does not link Chromium or V8
        run: |
          python3 - <<'PY'
          import subprocess
          symbols = subprocess.check_output(['nm', '-C', 'out/runtime/weber-desktop-host'], text=True)
          assert not any(name in symbols for name in ('v8::', 'content::', 'blink::'))
          print(subprocess.check_output(['ldd', 'out/runtime/weber-desktop-host'], text=True))
          PY
      - name: Test TOML backend selection
        id: config
        continue-on-error: true
        run: |
          cargo test --manifest-path weber/runtime-config/Cargo.toml
          cargo test --manifest-path weber/native-runtime/Cargo.toml
      - name: Test native Rust backend without Node
        id: native
        continue-on-error: true
        env:
          WEBER_DESKTOP_HOST: ${{ github.workspace }}/out/runtime/weber-desktop-host
          WEBER_OBSCURA_RENDERER: ${{ github.workspace }}/out/runtime/obscura/weber-obscura-renderer
        run: |
          cargo build --release --manifest-path weber/native-example/Cargo.toml
          xvfb-run -a cargo run --manifest-path weber/runtime-config/Cargo.toml -- run --runtime-root weber/electron-runtime --project weber/native-example
      - name: Compile original Electron API source
        run: |
          npm ci --prefix weber/electron-runtime
          node weber/electron-runtime/build.cjs
      - name: Test original Electron API on Obscura
        id: node
        continue-on-error: true
        env:
          WEBER_DESKTOP_HOST: ${{ github.workspace }}/out/runtime/weber-desktop-host
          WEBER_OBSCURA_RENDERER: ${{ github.workspace }}/out/runtime/obscura/weber-obscura-renderer
        run: |
          xvfb-run -a node weber/electron-runtime/test-live.cjs
          cp weber-electron-live-result.json out/node-live.json
      - name: Test original Electron API on Bun
        id: bun
        continue-on-error: true
        env:
          WEBER_DESKTOP_HOST: ${{ github.workspace }}/out/runtime/weber-desktop-host
          WEBER_OBSCURA_RENDERER: ${{ github.workspace }}/out/runtime/obscura/weber-obscura-renderer
        run: |
          xvfb-run -a bun weber/electron-runtime/test-live.cjs
          cp weber-electron-live-result.json out/bun-live.json
      - name: Test original Electron menus on native GTK
        id: menus
        continue-on-error: true
        env:
          WEBER_DESKTOP_HOST: ${{ github.workspace }}/out/runtime/weber-desktop-host
          WEBER_OBSCURA_RENDERER: ${{ github.workspace }}/out/runtime/obscura/weber-obscura-renderer
        run: |
          node --test weber/electron-runtime/test-menu-binding.cjs weber/electron-runtime/test-platform-app.cjs
          xvfb-run -a python3 weber/electron-runtime/test-menu-live.py node
      - name: Test synchronous platform transport and native global shortcuts
        id: shortcuts
        continue-on-error: true
        env:
          WEBER_DESKTOP_HOST: ${{ github.workspace }}/out/runtime/weber-desktop-host
          WEBER_OBSCURA_RENDERER: ${{ github.workspace }}/out/runtime/obscura/weber-obscura-renderer
        run: |
          node weber/electron-runtime/platform-sync/test.cjs
          bun weber/electron-runtime/platform-sync/test.cjs
          node weber/electron-runtime/platform-sync/tests/test-foreign-wrapper.cjs
          bun weber/electron-runtime/platform-sync/tests/test-foreign-wrapper.cjs
          xvfb-run -a python3 weber/electron-runtime/test-shortcut-live.py node
          xvfb-run -a python3 weber/electron-runtime/test-shortcut-live.py bun
      - name: Test original protocol APIs and custom resource origins
        id: protocols
        continue-on-error: true
        env:
          WEBER_DESKTOP_HOST: ${{ github.workspace }}/out/runtime/weber-desktop-host
          WEBER_OBSCURA_RENDERER: ${{ github.workspace }}/out/runtime/obscura/weber-obscura-renderer
        run: |
          xvfb-run -a node weber/electron-runtime/bootstrap.cjs weber/electron-runtime/protocol-fixture
          xvfb-run -a bun weber/electron-runtime/bootstrap.cjs weber/electron-runtime/protocol-fixture
      - name: Assemble and execute Linux development bundle
        id: bundle
        continue-on-error: true
        run: |
          cargo build --release --manifest-path weber/runtime-config/Cargo.toml
          python3 -m unittest discover -s weber/packaging -p 'test_*.py'
          python3 weber/packaging/package.py --output out/development-bundle
          mkdir -p out/extracted-bundle
          tar -xzf out/development-bundle/weber-*-development-*.tar.gz -C out/extracted-bundle
          for backend in node bun native; do
            xvfb-run -a python3 out/extracted-bundle/weber-*/smoke.py --backend "$backend" --output "out/bundle-$backend.json"
          done
      - name: Compare the same application with pinned Electron
        id: benchmark
        timeout-minutes: 6
        continue-on-error: true
        env:
          WEBER_DESKTOP_HOST: ${{ github.workspace }}/out/runtime/weber-desktop-host
          WEBER_OBSCURA_RENDERER: ${{ github.workspace }}/out/runtime/obscura/weber-obscura-renderer
        run: |
          npm install --prefix "$RUNNER_TEMP/electron-baseline" electron@42.0.0
          timeout 180 node "$RUNNER_TEMP/electron-baseline/node_modules/electron/install.js"
          test -x "$RUNNER_TEMP/electron-baseline/node_modules/electron/dist/electron"
          node --test weber/benchmarks/proc-tree.test.cjs weber/benchmarks/process-cleanup.test.cjs
          xvfb-run -a -s '-screen 0 1600x900x24' node weber/benchmarks/compare.cjs --electron "$RUNNER_TEMP/electron-baseline/node_modules/electron/dist/electron" --node "$(command -v node)" --bootstrap "$PWD/weber/electron-runtime/bootstrap.cjs" --output "$PWD/out/benchmark.json"
      - name: Diagnose unmodified VS Code startup
        id: vscode
        continue-on-error: true
        run: xvfb-run -a python3 weber/vscode-probe/run.py --output out/vscode-startup.json
      - name: Require every runtime check to pass
        if: always()
        env:
          RESULTS: ${{ steps.engine.outcome }} ${{ steps.boundary.outcome }} ${{ steps.desktop.outcome }} ${{ steps.config.outcome }} ${{ steps.native.outcome }} ${{ steps.node.outcome }} ${{ steps.bun.outcome }} ${{ steps.menus.outcome }} ${{ steps.shortcuts.outcome }} ${{ steps.bundle.outcome }} ${{ steps.protocols.outcome }}
        run: |
          python3 - <<'PY_GATE'
          import os
          outcomes = os.environ['RESULTS'].split()
          assert len(outcomes) == 11 and all(result == 'success' for result in outcomes), outcomes
          PY_GATE
      - name: Require measurements and startup diagnostic to complete
        if: always()
        env:
          BENCHMARK: ${{ steps.benchmark.outcome }}
          VSCODE_DIAGNOSTIC: ${{ steps.vscode.outcome }}
        run: |
          python3 - <<'PY_EVIDENCE'
          import os
          # These assert evidence collection, never a performance win or VS Code readiness.
          assert os.environ['BENCHMARK'] == 'success', os.environ['BENCHMARK']
          assert os.environ['VSCODE_DIAGNOSTIC'] == 'success', os.environ['VSCODE_DIAGNOSTIC']
          PY_EVIDENCE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-source-evidence
          path: |
            weber/electron-runtime/dist/source-manifest.json
            weber-electron-live-result.json
            out/node-live.json
            out/bun-live.json
            out/benchmark.json
            out/vscode-startup.json
            out/bundle-*.json
            out/runtime/Testing/Temporary/LastTest.log
      - uses: actions/upload-artifact@v4
        if: ${{ success() && steps.bundle.outcome == 'success' }}
        with:
          name: weber-linux-development
          compression-level: 0
          path: |
            out/development-bundle/*.tar.gz
            out/development-bundle/*.sha256
            out/bundle-*.json
