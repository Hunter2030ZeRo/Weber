<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Weber</title>
<style>
body { margin: 48px; color: #20242a; background: #f9fafb; font: 18px sans-serif; }
button, input { padding: 12px; font: inherit; }
pre { padding: 20px; background: #eceef0; white-space: pre-wrap; }
</style>
<h1>Weber</h1>
<p>This page is rendered by Obscura. Its backend can run in Node.js, Bun, or native Rust.</p>
<button id="info">Ask the backend</button>
<pre id="result">Waiting for a backend call.</pre>
<p><label>Input test <input placeholder="Type here"></label></p>
<script>
document.getElementById('info').addEventListener('click', async () => {
  const result = document.getElementById('result');
  try { result.textContent = JSON.stringify(await weber.invoke('system.info'), null, 2); }
  catch (error) { result.textContent = String(error); }
});
</script>
</html>
